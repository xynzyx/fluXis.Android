name: Build Android APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Fix Target Framework
        run: sed -i 's/net8.0-android/net10.0-android/g' fluXis.Android/fluXis.Android.csproj

      - name: Build APK
        run: dotnet publish fluXis.Android/fluXis.Android.csproj -c Release -f net10.0-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fluXis-Android-APK
          path: fluXis.Android/bin/Release/**/*.apk
